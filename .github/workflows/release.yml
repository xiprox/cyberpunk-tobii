# release-please reads the conventional commits on main and keeps a release pull request open with the
# next version and its changelog. Merging that pull request tags the version and publishes a GitHub
# release, and only then does the build job run: it builds the plugin and attaches a zip that holds it
# and the CET mod, laid out as the game folder is, then uploads the same zip to Nexus Mods.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # The RED4ext.SDK commit the plugin builds against: "Update types for patch 2.5".
      RED4EXT_SDK_COMMIT: 5246e659d783e5834cc08a90e56c8932c9ed3449
    steps:
      - uses: actions/checkout@v7

      - name: Get RED4ext.SDK
        run: |
          git init deps/RED4ext.SDK
          git -C deps/RED4ext.SDK fetch --depth 1 https://github.com/WopsS/RED4ext.SDK $env:RED4EXT_SDK_COMMIT
          git -C deps/RED4ext.SDK checkout --quiet FETCH_HEAD

      # No -G, so CMake picks the newest Visual Studio on the runner image.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake --install build --config Release --prefix stage
          $zip = "TobiiHeadTracking-$env:TAG.zip"
          7z a -tzip $zip ./stage/*
          gh release upload $env:TAG $zip --repo $env:GITHUB_REPOSITORY

      # Nexus Mods only takes a new version of a file already on the mod page, so the first upload is
      # made by hand on the site. Until the repository has both variables, a release skips these steps.
      - name: Turn the release notes into a Nexus Mods changelog
        id: notes
        if: vars.NEXUSMODS_MOD_ID != '' && vars.NEXUSMODS_FILE_ID != ''
        env:
          BODY: ${{ needs.release-please.outputs.body }}
        run: |
          # Nexus takes one entry per line and shows Markdown as typed, so keep only the list items,
          # without the "* ", the scope such as "**settings:** ", or the links such as
          # " ([1a2b3c4](https://...))". A breaking change is listed twice, under its own heading and
          # its type's, so it's kept once.
          $entries = $env:BODY -split '\r?\n' | Where-Object { $_ -match '^\* ' } | ForEach-Object {
            $entry = $_ -replace '^\* (\*\*[^*]+:\*\* )?', '' -replace ' \(\[[^\]]+\]\([^)]+\)\)', ''
            $entry.Substring(0, 1).ToUpper() + $entry.Substring(1)
          }
          $notes = ($entries | Select-Object -Unique) -join "`n"
          $delimiter = "EOF$([guid]::NewGuid().ToString('N'))"
          "changelog<<$delimiter", $notes, $delimiter | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Upload to Nexus Mods
        if: steps.notes.outcome == 'success'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: TobiiHeadTracking-${{ env.TAG }}.zip
          version: ${{ needs.release-please.outputs.version }}
          display_name: Tobii Head Tracking
          changelog: ${{ steps.notes.outputs.changelog }}
          archive_existing_version: true
          update_mod_version: true
          # Keeps mod managers' default download on the newest version, as the first upload was.
          primary_mod_manager_download: true
